<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Alerts — Easyy AI</title>
  <meta name="description" content="Set up personalised job alerts on Telegram and email. Free." />
  <style>
    :root {
      --bg: #f6f7fb; --card: #ffffff; --text: #14161c; --muted: #5b6472;
      --border: #e4e7ee; --accent: #4f46e5; --accent-ink: #ffffff;
      --danger: #dc2626; --ok: #16a34a; --field: #ffffff; --shadow: 0 1px 3px rgba(20,22,28,.08), 0 8px 24px rgba(20,22,28,.06);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0f14; --card: #161922; --text: #eef0f5; --muted: #9aa3b2;
        --border: #262b36; --accent: #7c74ff; --accent-ink: #0d0f14;
        --field: #10131a; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px 80px; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
    .brand .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
    .lede { color: var(--muted); margin: 6px 0 26px; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 16px;
      padding: 22px; margin: 0 0 18px; box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -.01em; }
    .card .hint { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    label .opt { font-weight: 400; color: var(--muted); }
    input[type=text], input[type=email], input[type=password], input[type=tel], input[type=number], select, textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      background: var(--field); color: var(--text); font: inherit; font-size: 14.5px;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    textarea { min-height: 60px; resize: vertical; }
    .row { display: flex; gap: 14px; flex-wrap: wrap; }
    .row > div { flex: 1 1 220px; }
    .checks { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
    .check { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 500; }
    .check input { width: auto; }
    .btn {
      appearance: none; border: 0; border-radius: 10px; padding: 11px 18px; font: inherit;
      font-weight: 600; font-size: 14.5px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
    }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn.ghost { background: transparent; color: var(--accent); padding: 6px 8px; }
    .btn.tiny { padding: 6px 10px; font-size: 13px; }
    .search {
      border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 14px; background: var(--bg);
    }
    .search-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .search-head h3 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 600; }
    details.adv { margin-top: 12px; }
    details.adv summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--accent); }
    details.adv .body { margin-top: 10px; }
    .err { color: var(--danger); font-size: 13px; margin-top: 6px; }
    .msg { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; }
    .msg.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
    .msg.info { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .msg.warn { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
    .who { color: var(--muted); font-size: 13px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
      padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border); }
    .pill.linked { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--border)); }
    .actions { display: flex; gap: 12px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .authlink { margin-left: auto; font-size: 13.5px; font-weight: 600; }
    .authalt { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13.5px; }
    .authalt a { font-weight: 500; }
    .authalt .sep { color: var(--muted); margin: 0 9px; }
    .check.terms { align-items: flex-start; margin-top: 16px; font-weight: 400; line-height: 1.45; }
    .check.terms input { margin-top: 2px; }
    /* international phone input */
    .phone { position: relative; display: flex; gap: 8px; }
    .phone-cc {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer; white-space: nowrap;
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--field);
      font-size: 14.5px; user-select: none;
    }
    .phone-cc:hover { border-color: var(--muted); }
    .phone-cc .flag { font-size: 17px; line-height: 1; }
    .phone-cc .caret { color: var(--muted); font-size: 11px; }
    .phone-num { flex: 1 1 auto; }
    .cc-backdrop { position: fixed; inset: 0; z-index: 40; }
    .cc-menu {
      position: absolute; z-index: 41; top: calc(100% + 6px); left: 0; width: min(360px, 100%);
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      box-shadow: var(--shadow); overflow: hidden;
    }
    .cc-search-wrap { padding: 10px; border-bottom: 1px solid var(--border); }
    .cc-search { width: 100%; }
    .cc-list { max-height: 260px; overflow-y: auto; }
    .cc-item {
      display: flex; align-items: center; gap: 10px; padding: 9px 12px; cursor: pointer; font-size: 14px;
    }
    .cc-item:hover { background: var(--bg); }
    .cc-item.sel { background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .cc-item .flag { font-size: 17px; line-height: 1; width: 22px; }
    .cc-item .cc-name { flex: 1 1 auto; }
    .cc-item .cc-dial { color: var(--muted); font-variant-numeric: tabular-nums; }
    .cc-empty { padding: 14px 12px; color: var(--muted); font-size: 13.5px; }
    /* password show/hide toggle beside the label */
    .labrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .pw-link {
      background: transparent; border: 0; color: var(--accent); font: inherit; font-size: 13px;
      font-weight: 600; cursor: pointer; padding: 0;
    }
    .foot { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 26px; }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .center { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 40px 0; color: var(--muted); }
  </style>
</head>
<body>
  <div id="app" class="wrap" v-cloak>

    <!-- loading -->
    <div v-if="booting" class="center"><div class="spinner"></div> Loading…</div>

    <!-- signed out / password recovery -->
    <template v-else-if="!session || recoveryMode">
      <div class="brand"><span class="dot"></span> Easyy AI · Job Alerts</div>
      <p class="lede">Get newly-posted jobs matching your searches, delivered to Telegram and email. Free.</p>

      <div class="card">
        <div v-if="authMsg" class="msg" :class="authMsgType">{{ authMsg }}</div>

        <!-- sign in -->
        <template v-if="authView === 'signin'">
          <h2>Sign in</h2>
          <p class="hint">Welcome back. Enter your email and password.</p>
          <label>Email</label>
          <input type="email" v-model.trim="authEmail" placeholder="you@example.com" autocomplete="email" @keyup.enter="signIn" />
          <label>Password</label>
          <input type="password" v-model="authPassword" placeholder="Your password" autocomplete="current-password" @keyup.enter="signIn" />
          <div class="actions">
            <button class="btn" :disabled="sending || !authEmail || !authPassword" @click="signIn">
              {{ sending ? 'Signing in…' : 'Sign in' }}
            </button>
            <a href="#" class="authlink" @click.prevent="go('forgot')">Forgot password?</a>
          </div>
          <div class="authalt">
            <a href="#" @click.prevent="go('signup')">Create an account</a>
            <span class="sep">·</span>
            <a href="#" @click.prevent="go('magic')">Email me a sign-in link instead</a>
          </div>
        </template>

        <!-- sign up -->
        <template v-else-if="authView === 'signup'">
          <h2>Create your account</h2>
          <p class="hint">A few details to set up your job alerts. Your email is also where digests go.</p>
          <label>Full name</label>
          <input type="text" v-model.trim="signup.full_name" placeholder="e.g. Pramesh Anuragi" autocomplete="name" />

          <label>Mobile number</label>
          <div class="phone">
            <div class="phone-cc" role="button" tabindex="0" @click="toggleCountry" @keyup.enter="toggleCountry">
              <span class="flag">{{ flagOf(dialIso) }}</span>
              <span class="dial">+{{ selectedDial }}</span>
              <span class="caret">▾</span>
            </div>
            <input type="tel" class="phone-num" v-model.trim="phoneLocal" placeholder="50 123 4567" autocomplete="tel-national" @keyup.enter="signUp" />
            <div v-if="countryOpen" class="cc-backdrop" @click="countryOpen = false"></div>
            <div v-if="countryOpen" class="cc-menu">
              <div class="cc-search-wrap">
                <input type="text" class="cc-search" v-model="countryQuery" ref="ccSearch" placeholder="Search country or code…" @click.stop />
              </div>
              <div class="cc-list">
                <div v-for="c in filteredCountries" :key="c.i" class="cc-item" :class="{ sel: c.i === dialIso }" @click="selectCountry(c.i)">
                  <span class="flag">{{ flagOf(c.i) }}</span>
                  <span class="cc-name">{{ c.n }}</span>
                  <span class="cc-dial">+{{ c.d }}</span>
                </div>
                <div v-if="!filteredCountries.length" class="cc-empty">No match — try another spelling or code.</div>
              </div>
            </div>
          </div>

          <label>Email</label>
          <input type="email" v-model.trim="authEmail" placeholder="you@example.com" autocomplete="email" />

          <div class="labrow">
            <label>Password <span class="opt">— at least 8 characters</span></label>
            <button type="button" class="pw-link" @click="showPw = !showPw">{{ showPw ? 'Hide' : 'Show' }}</button>
          </div>
          <input :type="showPw ? 'text' : 'password'" v-model="authPassword" placeholder="Choose a password" autocomplete="new-password" />
          <label>Confirm password</label>
          <input :type="showPw ? 'text' : 'password'" v-model="authPassword2" placeholder="Re-enter password" autocomplete="new-password" @keyup.enter="signUp" />

          <label class="check terms">
            <input type="checkbox" v-model="signup.agree" />
            <span>I agree to the <a href="terms.html" target="_blank" rel="noopener">Terms of Service</a> and <a href="privacy.html" target="_blank" rel="noopener">Privacy Policy</a>.</span>
          </label>
          <div class="actions">
            <button class="btn" :disabled="sending" @click="signUp">
              {{ sending ? 'Creating…' : 'Create account' }}
            </button>
          </div>
          <div class="authalt">
            <a href="#" @click.prevent="go('signin')">Already have an account? Sign in</a>
          </div>
        </template>

        <!-- magic link -->
        <template v-else-if="authView === 'magic'">
          <h2>Email me a sign-in link</h2>
          <p class="hint">We'll email a one-tap link — no password needed.</p>
          <label>Email</label>
          <input type="email" v-model.trim="authEmail" placeholder="you@example.com" autocomplete="email" @keyup.enter="sendMagicLink" />
          <div class="actions">
            <button class="btn" :disabled="sending || !authEmail" @click="sendMagicLink">
              {{ sending ? 'Sending…' : 'Send sign-in link' }}
            </button>
          </div>
          <div class="authalt">
            <a href="#" @click.prevent="go('signin')">Back to sign in</a>
          </div>
        </template>

        <!-- forgot password -->
        <template v-else-if="authView === 'forgot'">
          <h2>Reset your password</h2>
          <p class="hint">Enter your email and we'll send a link to set a new password.</p>
          <label>Email</label>
          <input type="email" v-model.trim="authEmail" placeholder="you@example.com" autocomplete="email" @keyup.enter="sendReset" />
          <div class="actions">
            <button class="btn" :disabled="sending || !authEmail" @click="sendReset">
              {{ sending ? 'Sending…' : 'Send reset link' }}
            </button>
          </div>
          <div class="authalt">
            <a href="#" @click.prevent="go('signin')">Back to sign in</a>
          </div>
        </template>

        <!-- set new password (after clicking reset link) -->
        <template v-else-if="authView === 'reset'">
          <h2>Set a new password</h2>
          <p class="hint">Choose a new password for your account.</p>
          <label>New password <span class="opt">— at least 8 characters</span></label>
          <input type="password" v-model="authPassword" placeholder="New password" autocomplete="new-password" />
          <label>Confirm password</label>
          <input type="password" v-model="authPassword2" placeholder="Re-enter password" autocomplete="new-password" @keyup.enter="setNewPassword" />
          <div class="actions">
            <button class="btn" :disabled="sending || !authPassword || !authPassword2" @click="setNewPassword">
              {{ sending ? 'Saving…' : 'Set new password' }}
            </button>
          </div>
        </template>
      </div>

      <p class="foot" v-if="authView === 'signup'">By continuing you agree to receive job-alert messages you configure here. You can pause or delete anytime.</p>
    </template>

    <!-- signed in -->
    <template v-else>
      <div class="topbar">
        <div class="brand"><span class="dot"></span> Job Alerts</div>
        <div class="who">{{ userEmail }} · <a href="#" @click.prevent="signOut">Sign out</a></div>
      </div>

      <div v-if="saveMsg" class="msg ok">{{ saveMsg }}</div>
      <div v-if="errorMsg" class="msg warn">{{ errorMsg }}</div>

      <!-- profile -->
      <div class="card">
        <h2>Your profile</h2>
        <p class="hint">Global preferences that apply to every search below.</p>
        <div class="row">
          <div>
            <label>Your name</label>
            <input type="text" v-model.trim="profile.full_name" maxlength="120" placeholder="Your full name" />
          </div>
          <div>
            <label>Mobile number</label>
            <input type="tel" v-model.trim="profile.phone" placeholder="+971 50 123 4567" />
          </div>
        </div>
        <div class="row">
          <div>
            <label>Profile name</label>
            <input type="text" v-model.trim="profile.name" maxlength="120" placeholder="My job search" />
          </div>
          <div>
            <label>Indeed country</label>
            <select v-model="profile.country_indeed">
              <option v-for="c in countries" :key="c" :value="c">{{ c }}</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label>Minimum salary <span class="opt">— optional, AED / month</span></label>
            <input type="number" min="0" step="500" v-model.number="salaryInput" placeholder="e.g. 25000" />
          </div>
        </div>
        <label>Exclude jobs whose title contains <span class="opt">— comma-separated, optional</span></label>
        <input type="text" v-model="excludeInput" placeholder="intern, junior, graduate" />
        <div class="checks">
          <label class="check"><input type="checkbox" v-model="profile.email_enabled" /> Email me digests ({{ userEmail }})</label>
          <label class="check"><input type="checkbox" v-model="profile.notify_when_empty" /> Ping me even when nothing new</label>
          <label class="check"><input type="checkbox" v-model="profile.is_active" /> Alerts active</label>
        </div>
      </div>

      <!-- telegram -->
      <div class="card">
        <h2>Telegram <span v-if="telegramLinked" class="pill linked">✓ Connected</span></h2>
        <p class="hint" v-if="telegramLinked">This chat is linked. You'll receive alerts on Telegram.</p>
        <p class="hint" v-else>Connect Telegram to get instant alerts. Save first, then tap connect and press <b>Start</b> in the bot.</p>
        <div class="actions" v-if="!telegramLinked">
          <button class="btn secondary" :disabled="!profile.id" @click="connectTelegram">Connect Telegram</button>
          <span v-if="polling" class="who"><span class="spinner" style="width:14px;height:14px;display:inline-block;vertical-align:middle"></span> waiting for you to press Start…</span>
        </div>
      </div>

      <!-- searches -->
      <div class="card">
        <h2>Searches <span class="opt" style="font-weight:400;color:var(--muted)">({{ searches.length }}/5)</span></h2>
        <p class="hint">Each search runs hourly. Add up to 5.</p>

        <div class="search" v-for="(s, i) in searches" :key="i">
          <div class="search-head">
            <h3>Search {{ i + 1 }}</h3>
            <button class="btn ghost tiny" @click="removeSearch(i)">Remove</button>
          </div>
          <label>Label</label>
          <input type="text" v-model.trim="s.name" placeholder="e.g. Data Scientist — Dubai" />
          <div class="row">
            <div>
              <label>Search query</label>
              <input type="text" v-model.trim="s.query" placeholder='"data scientist" NOT intern' />
            </div>
            <div>
              <label>Location</label>
              <input type="text" v-model.trim="s.location" placeholder="United Arab Emirates" />
            </div>
          </div>
          <div class="checks">
            <label class="check"><input type="checkbox" value="linkedin" v-model="s.sites" /> LinkedIn</label>
            <label class="check"><input type="checkbox" value="indeed" v-model="s.sites" /> Indeed</label>
            <label class="check"><input type="checkbox" value="google" v-model="s.sites" /> Google Jobs</label>
            <label class="check"><input type="checkbox" v-model="s.is_remote" /> Remote only</label>
          </div>

          <div v-if="s.sites.includes('google')" style="margin-top:12px">
            <label>Google Jobs search phrase <span class="opt">— required for Google</span></label>
            <input type="text" v-model.trim="s.google_search_term" placeholder="data scientist jobs in Dubai since yesterday" />
            <p class="hint" style="margin:6px 0 0">Google has no boolean search — paste the exact phrase you'd type into the Google Jobs box, and include freshness (e.g. "since yesterday").</p>
          </div>

          <details class="adv">
            <summary>Advanced</summary>
            <div class="body">
              <label>Keep only titles containing <span class="opt">— comma-separated, optional</span></label>
              <input type="text" v-model="s.require_kw_input" placeholder="data scientist, machine learning" />
              <div class="row">
                <div>
                  <label>LinkedIn query override <span class="opt">— optional</span></label>
                  <input type="text" v-model.trim="s.linkedin_query" />
                </div>
                <div>
                  <label>Indeed query override <span class="opt">— optional</span></label>
                  <input type="text" v-model.trim="s.indeed_query" />
                </div>
              </div>
            </div>
          </details>
          <div class="err" v-if="s._err">{{ s._err }}</div>
        </div>

        <button class="btn secondary tiny" :disabled="searches.length >= 5" @click="addSearch">+ Add search</button>
      </div>

      <div class="actions">
        <button class="btn" :disabled="saving" @click="save">{{ saving ? 'Saving…' : 'Save changes' }}</button>
        <span class="who" v-if="!telegramLinked && profile.email_enabled">Alerts will go to your email; connect Telegram for instant pings.</span>
      </div>
      <p class="foot">Alerts start within the hour after you save. Powered by Easyy AI.</p>
    </template>
  </div>

  <style>[v-cloak]{display:none}</style>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="countries.js"></script>
  <script src="app.js"></script>
</body>
</html>
